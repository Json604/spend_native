apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.vectoricons = [
    iconFontNames: ["MaterialCommunityIcons.ttf"]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react {
    autolinkLibrariesWithApp()
}

// db/migrations is authoritative for both TypeScript and Android. Syncing into
// the packaged source assets on every build prevents a hand-maintained copy
// from drifting away from the desktop/Node coordinator's schema chain.
def syncDatabaseMigrations = tasks.register("syncDatabaseMigrations", Sync) {
    from(rootProject.file("../db/migrations")) {
        include "???_*.sql"
    }
    into(layout.projectDirectory.dir("src/main/assets/migrations"))
}

// src/parser/rules/default.json is the classifier source of truth for TS and
// Android. The packaged copy is generated, never hand-maintained.
def syncClassifierRulePack = tasks.register("syncClassifierRulePack", Sync) {
    from(rootProject.file("../src/parser/rules/default.json"))
    into(layout.projectDirectory.dir("src/main/assets/rules"))
    rename { "default.json" }
}

tasks.named("preBuild").configure {
    dependsOn(syncDatabaseMigrations, syncClassifierRulePack)
}

def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.lym.spend'
    defaultConfig {
        applicationId 'com.lym.spend'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "2.3.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release credentials come from gradle.properties in the user's home
        // (~/.gradle/gradle.properties), never from this repo. Losing this key
        // means never being able to update the app for anyone who installed it,
        // because Android identifies an app by its signing certificate.
        release {
            def storePath = project.findProperty('SPEND_RELEASE_STORE_FILE')
            if (storePath && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword project.findProperty('SPEND_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('SPEND_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('SPEND_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Fall back to debug signing only when release credentials are absent,
            // so a fresh clone still builds. Any APK given to another person must
            // be signed with the real release key.
            signingConfig project.hasProperty('SPEND_RELEASE_STORE_FILE')
                ? signingConfigs.release
                : signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"

    // Gradle already ships these for its own test infrastructure, so the pure
    // JVM migration-parser test does not introduce another downloaded copy.
    testImplementation(files(new File(gradle.gradleHomeDir, "lib/junit-4.13.2.jar")))
    testImplementation(files(new File(gradle.gradleHomeDir, "lib/hamcrest-core-1.3.jar")))

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
